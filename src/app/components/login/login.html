<div
    style="max-width: 380px; margin: 60px auto; padding: 24px; border: 1px solid #ccc; border-radius: 8px; font-family: sans-serif;">
    <h2 style="margin-top: 0;">Iniciar Sesión</h2>

    <form (ngSubmit)="iniciarSesion()">
        <div style="margin-bottom: 12px;">
            <label>Usuario:</label><br>
            <input type="text" [(ngModel)]="username" name="username" required
                style="width: 100%; padding: 8px; box-sizing: border-box;" />
        </div>

        <div style="margin-bottom: 16px;">
            <label>Contraseña:</label><br>
            <input type="password" [(ngModel)]="password" name="password" required
                style="width: 100%; padding: 8px; box-sizing: border-box;" />
        </div>

        <p *ngIf="errorMensaje" style="color: #d9534f; font-size: 14px;">{{ errorMensaje }}</p>

        <button type="submit"
            style="width: 100%; padding: 10px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer;">
            Ingresar
        </button>
    </form>
</div>
